# ─────────────────────────────────────────────────────────────────
# application-docker.yml  — "docker" Spring profile
# ─────────────────────────────────────────────────────────────────
# When a service runs inside Docker, "localhost" doesn't point to
# the MySQL or RabbitMQ container — it points to the container
# itself. This profile replaces localhost with container names.
#
# HOW TO USE:
#   Copy this file to each service's src/main/resources/ folder.
#   The file is automatically activated when you pass:
#       -Dspring.profiles.active=docker
#   (which the Dockerfile does via the ENTRYPOINT)
#
# IMPORTANT: This file only overrides what's different in Docker.
#            Everything else still comes from application.yml.
# ─────────────────────────────────────────────────────────────────

spring:
  datasource:
    # Replace "localhost" with the MySQL container name
    url: jdbc:mysql://mysql:3306/auth_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:medibook_user}
    password: ${DB_PASSWORD:medibook_pass}

  rabbitmq:
    host: rabbitmq       # container name, not localhost
    port: 5672
    username: guest
    password: guest

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}

eureka:
  client:
    service-url:
      defaultZone: http://admin:medibook123@eureka-server:8761/eureka/
  instance:
    prefer-ip-address: true