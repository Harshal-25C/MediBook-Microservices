      retries: 18
      start_period: 10m
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  payment-service:
    <<: *service-defaults
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    image: ${DOCKERHUB_USERNAME:-httpsharsh}/medibook-payment-service:${IMAGE_TAG:-latest}
    container_name: medibook-payment
    ports:
      - "8085:8085"
    environment:
      <<: *spring-env
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/payment_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      EUREKA_INSTANCE_HOSTNAME: payment-service
      RAZORPAY_API_KEY: ${RAZORPAY_API_KEY}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
    healthcheck:
      test: ["CMD-SHELL", "nc -z -w 2 localhost 8085"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 10m
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  review-service:
    <<: *service-defaults
    build:
      context: ./review-service
      dockerfile: Dockerfile
    image: ${DOCKERHUB_USERNAME:-httpsharsh}/medibook-review-service:${IMAGE_TAG:-latest}
    container_name: medibook-review
