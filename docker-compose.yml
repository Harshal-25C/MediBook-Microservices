# ─────────────────────────────────────────────────────────────────
# MediBook — Full Stack Docker Compose
# ─────────────────────────────────────────────────────────────────

networks:
  medibook-net:
    driver: bridge

volumes:
  mysql_data:
  rabbitmq_data:

x-service-defaults: &service-defaults
  networks:
    - medibook-net
  restart: unless-stopped

x-spring-env: &spring-env
  DB_USERNAME: ${DB_USERNAME:-medibook_user}
  DB_PASSWORD: ${DB_PASSWORD:-medibook_pass}
  JWT_SECRET: ${JWT_SECRET}
  EUREKA_DEFAULT_ZONE: http://admin:medibook123@eureka-server:8761/eureka/
  MAIL_USERNAME: ${MAIL_USERNAME}
  MAIL_PASSWORD: ${MAIL_PASSWORD}

services:

  # ── INFRASTRUCTURE ─────────────────────────────────────────────

  mysql:
    <<: *service-defaults
    image: mysql:8.0
    container_name: medibook-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_USER: ${DB_USERNAME:-medibook_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-medibook_pass}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    # NO healthcheck — services use Spring retry to connect

  rabbitmq:
    <<: *service-defaults
    image: rabbitmq:3.12-management-alpine
    container_name: medibook-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ── SERVICE REGISTRY ───────────────────────────────────────────

  eureka-server:
    <<: *service-defaults
    build:
      context: ./eureka-server
      dockerfile: Dockerfile
    image: ${DOCKERHUB_USERNAME:-httpsharsh}/medibook-eureka-server:${IMAGE_TAG:-latest}
    container_name: medibook-eureka
    ports:
      - "8761:8761"
    # NO healthcheck — curl not in JRE alpine; services retry on their own

  # ── API GATEWAY ────────────────────────────────────────────────

  api-gateway:
    <<: *service-defaults
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    image: ${DOCKERHUB_USERNAME:-httpsharsh}/medibook-api-gateway:${IMAGE_TAG:-latest}
    container_name: medibook-gateway
    ports:
      - "8080:8080"
    environment:
      <<: *spring-env
    depends_on:
      - eureka-server

  # ── MICROSERVICES ──────────────────────────────────────────────

  auth-service:
    <<: *service-defaults
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    image: ${DOCKERHUB_USERNAME:-httpsharsh}/medibook-auth-service:${IMAGE_TAG:-latest}
    container_name: medibook-auth
    ports:
      - "8081:8081"
    environment:
      <<: *spring-env
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/auth_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      ADMIN_PASSWORD_1: ${ADMIN_PASSWORD-1}
      ADMIN_PASSWORD_2: ${ADMIN_PASSWORD-2}
    depends_on:
      - mysql
      - eureka-server

  provider-service:
    <<: *service-defaults
    build:
      context: ./provider-service
      dockerfile: Dockerfile
    image: ${DOCKERHUB_USERNAME:-httpsharsh}/medibook-provider-service:${IMAGE_TAG:-latest}
    container_name: medibook-provider
    ports:
      - "8082:8082"
    environment:
      <<: *spring-env
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/provider_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    depends_on:
      - mysql
      - eureka-server

  schedule-service:
    <<: *service-defaults
    build:
      context: ./schedule-service
      dockerfile: Dockerfile
    image: ${DOCKERHUB_USERNAME:-httpsharsh}/medibook-schedule-service:${IMAGE_TAG:-latest}
    container_name: medibook-schedule
    ports:
      - "8083:8083"
    environment:
      <<: *spring-env
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/schedule_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    depends_on:
      - mysql
      - eureka-server

  appointment-service:
    <<: *service-defaults
    build:
      context: ./appointment-service
      dockerfile: Dockerfile
    image: ${DOCKERHUB_USERNAME:-httpsharsh}/medibook-appointment-service:${IMAGE_TAG:-latest}
    container_name: medibook-appointment
    ports:
      - "8084:8084"
    environment:
      <<: *spring-env
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/appointment_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_RABBITMQ_HOST: rabbitmq
    depends_on:
      - mysql
      - rabbitmq
      - eureka-server

  payment-service:
    <<: *service-defaults
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    image: ${DOCKERHUB_USERNAME:-httpsharsh}/medibook-payment-service:${IMAGE_TAG:-latest}
    container_name: medibook-payment
    ports:
      - "8085:8085"
    environment:
      <<: *spring-env
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/payment_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      RAZORPAY-API-KEY: ${RAZORPAY-API-KEY}
      RAZORPAY-KEY-SECRET: ${RAZORPAY-KEY-SECRET}
    depends_on:
      - mysql
      - eureka-server

  review-service:
    <<: *service-defaults
    build:
      context: ./review-service
      dockerfile: Dockerfile
    image: ${DOCKERHUB_USERNAME:-httpsharsh}/medibook-review-service:${IMAGE_TAG:-latest}
    container_name: medibook-review
    ports:
      - "8086:8086"
    environment:
      <<: *spring-env
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/review_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    depends_on:
      - mysql
      - eureka-server

  notification-service:
    <<: *service-defaults
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    image: ${DOCKERHUB_USERNAME:-httpsharsh}/medibook-notification-service:${IMAGE_TAG:-latest}
    container_name: medibook-notification
    ports:
      - "8087:8087"
    environment:
      <<: *spring-env
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/notification_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_RABBITMQ_HOST: rabbitmq
    depends_on:
      - mysql
      - rabbitmq
      - eureka-server

  record-service:
    <<: *service-defaults
    build:
      context: ./record-service
      dockerfile: Dockerfile
    image: ${DOCKERHUB_USERNAME:-httpsharsh}/medibook-record-service:${IMAGE_TAG:-latest}
    container_name: medibook-record
    ports:
      - "8088:8088"
    environment:
      <<: *spring-env
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/record_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    depends_on:
      - mysql
      - eureka-server

  admin-service:
    <<: *service-defaults
    build:
      context: ./admin-service
      dockerfile: Dockerfile
    image: ${DOCKERHUB_USERNAME:-httpsharsh}/medibook-admin-service:${IMAGE_TAG:-latest}
    container_name: medibook-admin
    ports:
      - "8089:8089"
    environment:
      <<: *spring-env
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/auth_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      ADMIN_PASSWORD_1: ${ADMIN_PASSWORD-1}
      ADMIN_PASSWORD_2: ${ADMIN_PASSWORD-2}
    depends_on:
      - mysql
      - eureka-server