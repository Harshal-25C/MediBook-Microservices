# â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
# MediBook â€” Full Stack Docker Compose
# â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€

networks:
  medibook-net:
    driver: bridge

volumes:
  mysql_data:
  rabbitmq_data:

x-service-defaults: &service-defaults
  networks:
    - medibook-net
  restart: unless-stopped

x-spring-env: &spring-env
  DB_USERNAME: ${DB_USERNAME:-medibook_user}
  DB_PASSWORD: ${DB_PASSWORD:-medibook_pass}
  JWT_SECRET: ${JWT_SECRET}
  EUREKA_DEFAULT_ZONE: http://admin:medibook123@eureka-server:8761/eureka/
  EUREKA_INSTANCE_PREFER_IP_ADDRESS: "false"
  MAIL_USERNAME: ${MAIL_USERNAME}
  MAIL_PASSWORD: ${MAIL_PASSWORD}

services:

  # â”€â”€ INFRASTRUCTURE â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€

  mysql:
    <<: *service-defaults
    image: mysql:8.0
    container_name: medibook-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_USER: ${DB_USERNAME:-medibook_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-medibook_pass}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 2m

  rabbitmq:
    <<: *service-defaults
    image: rabbitmq:3.12-management-alpine
    container_name: medibook-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "nc -z -w 2 localhost 5672"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 2m

  # â”€â”€ SERVICE REGISTRY â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€

  eureka-server:
    <<: *service-defaults
    build:
      context: ./eureka-server
      dockerfile: Dockerfile
    image: ${DOCKERHUB_USERNAME:-httpsharsh}/medibook-eureka-server:${IMAGE_TAG:-latest}
    container_name: medibook-eureka
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "wget -T 2 -q --spider --header 'Authorization: Basic YWRtaW46bWVkaWJvb2sxMjM=' http://127.0.0.1:8761/eureka/apps/"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 2m

  # â”€â”€ API GATEWAY â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€

  api-gateway:
    <<: *service-defaults
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    image: ${DOCKERHUB_USERNAME:-httpsharsh}/medibook-api-gateway:${IMAGE_TAG:-latest}
    container_name: medibook-gateway
    ports:
      - "8080:8080"
    environment:
      <<: *spring-env
      EUREKA_INSTANCE_HOSTNAME: api-gateway
    healthcheck:
      test: ["CMD-SHELL", "nc -z -w 2 localhost 8080"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 10m
    depends_on:
      eureka-server:
        condition: service_healthy

  # â”€â”€ MICROSERVICES â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€

  auth-service:
    <<: *service-defaults
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    image: ${DOCKERHUB_USERNAME:-httpsharsh}/medibook-auth-service:${IMAGE_TAG:-latest}
    container_name: medibook-auth
    ports:
      - "8081:8081"
    environment:
      <<: *spring-env
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/auth_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      EUREKA_INSTANCE_HOSTNAME: auth-service
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      ADMIN_PASSWORD_1: ${ADMIN_PASSWORD_1}
      ADMIN_PASSWORD_2: ${ADMIN_PASSWORD_2}
    healthcheck:
      test: ["CMD-SHELL", "nc -z -w 2 localhost 8081"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 10m
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  provider-service:
    <<: *service-defaults
    build:
      context: ./provider-service
      dockerfile: Dockerfile
    image: ${DOCKERHUB_USERNAME:-httpsharsh}/medibook-provider-service:${IMAGE_TAG:-latest}
    container_name: medibook-provider
    ports:
      - "8082:8082"
    environment:
      <<: *spring-env
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/provider_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      EUREKA_INSTANCE_HOSTNAME: provider-service
    healthcheck:
