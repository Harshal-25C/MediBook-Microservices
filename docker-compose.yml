      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 10m
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  schedule-service:
    <<: *service-defaults
    build:
      context: ./schedule-service
      dockerfile: Dockerfile
    image: ${DOCKERHUB_USERNAME:-httpsharsh}/medibook-schedule-service:${IMAGE_TAG:-latest}
