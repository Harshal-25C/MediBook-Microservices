server:
  port: 8081

spring:
  application:
    name: auth-service

  # ── MySQL ──────────────────────────────────────────────────────────────────
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/auth_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:medibook_user}
    password: ${DB_PASSWORD:medibook_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  # ── Redis (OTP storage + token blacklist) ─────────────────────────────────
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  # ── JavaMailSender — Gmail SMTP ───────────────────────────────────────────
  # STEP: Go to your Gmail account → Google Account → Security
  # → Enable 2-Step Verification first
  # → Then go to: myaccount.google.com/apppasswords
  # → Create App Password for "Mail" → copy the 16-character password
  # → Paste it below as the password (NOT your regular Gmail password)
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}        # ← PUT YOUR GMAIL HERE
    password: ${MAIL_PASSWORD}        # ← PUT APP PASSWORD HERE (not Gmail password)
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  # ── OAuth2 (Google + GitHub) ──────────────────────────────────────────────
  # GOOGLE SETUP STEPS:
  # 1. Go to: console.cloud.google.com
  # 2. Create new project → name it "MediBook"
  # 3. Go to APIs & Services → OAuth consent screen → External → Fill app name
  # 4. Go to APIs & Services → Credentials → Create OAuth 2.0 Client ID
  # 5. Application type: Web application
  # 6. Authorized redirect URIs: http://localhost:8081/login/oauth2/code/google
  # 7. Copy Client ID and Client Secret below
  #
  # GITHUB SETUP STEPS:
  # 1. Go to: github.com → Settings → Developer settings → OAuth Apps
  # 2. New OAuth App → Application name: MediBook
  # 3. Homepage URL: http://localhost:8081
  # 4. Authorization callback URL: http://localhost:8081/login/oauth2/code/github
  # 5. Copy Client ID and Client Secret below
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid, profile, email
            redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8081/login/oauth2/code/google}
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope: user:email
            redirect-uri: ${GITHUB_REDIRECT_URI:http://localhost:8081/login/oauth2/code/github}

  thymeleaf:
    check-template-location: false

# ── JWT config ──────────────────────────────────────────────────────────────
medibook:
  jwt:
    secret: ${JWT_SECRET}      # medibook-super-secret-key-must-be-at-least-256-bits-long-change-in-prod
    expiration: ${JWT_EXPIRATION:86400000}       # 24 hours in ms
  otp:
    expiry-minutes: ${OTP_EXPIRY_MINUTES:10}       # OTP expires in 10 minutes

# ── Eureka Client ────────────────────────────────────────────────────────────
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://admin:medibook123@localhost:8761/eureka/}
    enabled: ${EUREKA_ENABLED:true}
    fetch-registry: ${EUREKA_FETCH_REGISTRY:true}
    register-with-eureka: ${EUREKA_REGISTER_WITH_EUREKA:true}
  instance:
    prefer-ip-address: ${EUREKA_PREFER_IP_ADDRESS:true}

# ── Actuator ─────────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics

# ── Swagger ──────────────────────────────────────────────────────────────────
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html